#  El formulario por el que se publica un plugin en el registro de k4.
#
#  En inglés, aunque el proyecto hable español por dentro: esto lo rellena
#  gente de fuera, y un ecosistema al que solo puede entrar quien sepa español
#  no es un ecosistema. La regla del idioma es para los identificadores del
#  código, no para lo que lee un desconocido.
#
#  Pide un COMMIT y no una rama a propósito: una rama se mueve después de que
#  alguien la haya mirado, y entonces lo que se instala deja de ser lo que se
#  revisó. Publicar una versión nueva es abrir otra incidencia con el SHA
#  nuevo, que cuesta un minuto y hace que la revisión signifique algo.

name: Publish a plugin
description: Add your plugin to the registry so it can be installed from k4
title: "[plugin] "
labels: ["envio"]
body:
  - type: markdown
    attributes:
      value: |
        When you open this, a bot fetches that exact commit, validates it with
        `tools/plugins.py` — **without running any of your plugin** — and
        comments with what it found: what the manifest declares, which
        permissions it asks for, which surfaces it occupies.

        That is not a security audit and is not presented as one. A plugin
        runs inside the bar and can do whatever the bar can do. A person signs
        off on publishing, not the bot.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Public, on GitHub, the root URL
      placeholder: https://github.com/your-name/your-plugin
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: >
        The full 40-character SHA you want published — `git rev-parse HEAD`.
        A branch will not do: it moves after review, and then what people
        install is no longer what was reviewed.
      placeholder: 4f1c2ab9e0d3c7b1a58f6e2d0c9b8a7f6e5d4c3b
    validations:
      required: true

  - type: input
    id: folder
    attributes:
      label: Folder
      description: Only if `plugin.json` is not at the repository root
      placeholder: examples/my-plugin

  - type: checkboxes
    id: checked
    attributes:
      label: Before you send it
      options:
        - label: >
            `python3 tools/plugins.py` passes on my plugin, and the permissions
            it declares are the ones it uses.
          required: true
        - label: >
            The repository is public and has a license.
          required: true
        - label: >
            I understand that publishing a new version means opening another
            submission with the new SHA.
          required: true
