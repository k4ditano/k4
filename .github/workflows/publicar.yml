#  El proceso de publicación de un plugin en el registro.
#
#  Dos trabajos y una regla entre ellos: el robot MIRA, la persona FIRMA.
#
#  `revisar` corre en cada apertura y edición de un envío y no toca el
#  registro: se trae el commit que dice el formulario, lo valida y comenta lo
#  que ve. `publicar` solo se dispara cuando alguien con permiso de escritura
#  pone la etiqueta `publicado`, y antes de escribir nada vuelve a validar y
#  comprueba que el commit sea el mismo que se revisó.
#
#  Sobre la seguridad de esto: el cuerpo de una incidencia lo escribe
#  cualquiera, así que NUNCA se interpola en un `run:` —eso es ejecución de
#  código ajeno en el runner— sino que se pasa por `env:` y se escribe a un
#  fichero. Y el guion de revisión no ejecuta nada del plugin: clona y compara
#  ficheros, y ya.

name: publicar plugin

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  #  Las etiquetas tienen que EXISTIR antes de que nadie las use: el primer
  #  envío de verdad falló con «'envio' not found», porque el formulario las
  #  pide y nadie las había creado. Esto las crea si faltan y no toca las que
  #  ya estén, así que se puede quedar corriendo siempre.
  etiquetas:
    if: contains(github.event.issue.labels.*.name, 'envio')
    runs-on: ubuntu-latest
    steps:
      - name: Que existan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          crear() {
            gh label create "$1" --repo "$REPO" --color "$2" \
              --description "$3" 2>/dev/null || true
          }
          crear envio                 1D76DB "Un plugin enviado para el registro"
          crear validado              0E8A16 "El robot lo ha validado en ese commit"
          crear necesita-arreglos     D93F0B "Algo que arreglar antes de publicarlo"
          crear revision-de-seguridad FBCA04 "Pide permisos o saltó una regla: lo mira una persona"
          crear publicado             5319E7 "Publicado en el registro (la pone un mantenedor)"

  revisar:
    if: >
      contains(github.event.issue.labels.*.name, 'envio')
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      #  Por `env`, no por interpolación: el cuerpo es texto de un
      #  desconocido y en un `run:` sería una orden más.
      - name: El envío, a un fichero
        env:
          CUERPO: ${{ github.event.issue.body }}
        run: printf '%s' "$CUERPO" > /tmp/envio.txt

      - name: Revisar el commit que dice
        id: revision
        run: python3 tools/publicar.py --revisar /tmp/envio.txt > /tmp/informe.md

      - name: Contarlo en la incidencia
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMERO" --body-file /tmp/informe.md

      - name: Y dejar dicho en qué estado queda
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          ETIQUETA: ${{ steps.revision.outputs.etiqueta }}
        run: |
          for vieja in validado necesita-arreglos revision-de-seguridad; do
            gh issue edit "$NUMERO" --remove-label "$vieja" || true
          done
          gh issue edit "$NUMERO" --add-label "$ETIQUETA"

  publicar:
    if: >
      github.event.action == 'labeled'
      && github.event.label.name == 'publicado'
      && contains(github.event.issue.labels.*.name, 'envio')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      #  Quien pone la etiqueta tiene que poder escribir en el repo. GitHub no
      #  lo comprueba solo: cualquiera con una incidencia abierta puede
      #  etiquetar si el repo lo permite, así que se comprueba aquí.
      - name: ¿Quién ha etiquetado?
        env:
          GH_TOKEN: ${{ github.token }}
          QUIEN: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          permiso=$(gh api "repos/$REPO/collaborators/$QUIEN/permission" \
                    --jq .permission || echo ninguno)
          case "$permiso" in
            admin|write) echo "vale: $QUIEN tiene $permiso" ;;
            *) echo "$QUIEN no puede publicar (permiso: $permiso)"; exit 1 ;;
          esac

      - name: El envío, a un fichero
        env:
          CUERPO: ${{ github.event.issue.body }}
        run: printf '%s' "$CUERPO" > /tmp/envio.txt

      #  Se vuelve a validar en vez de fiarse del informe de antes: entre la
      #  revisión y la firma pueden haber pasado días, y el guion se niega si
      #  el commit ya no es el mismo.
      - name: Validar otra vez y meterlo en el registro
        run: python3 tools/publicar.py --anadir /tmp/envio.txt

      - name: Que el registro siga siendo válido
        run: python3 tools/plugins.py

      - name: Guardarlo
        env:
          NUMERO: ${{ github.event.issue.number }}
        run: |
          #  La identidad del bot de Actions, y NO una inventada.
          #
          #  Puse `k4@users.noreply.github.com` pensando que era un correo sin
          #  dueño. GitHub mapea `<usuario>@users.noreply.github.com` a la
          #  cuenta de ese usuario, y `k4` es una persona real: le atribuí un
          #  commit y apareció como colaborador de un repo que no ha tocado en
          #  su vida. Un correo `noreply` no es un correo libre.
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/registro.json
          git commit -m "Publicar un plugin (#$NUMERO)" || exit 0
          git push

      - name: Y decirlo
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --body \
            'Publicado. Ya sale en `tools/plugins.py --search` y en la tienda de la barra.'
          gh issue close "$NUMERO"

  #  ── firmar algo que ya no se puede publicar ──────────────────────────────
  #
  #  `publicar` pide las DOS etiquetas, y hace bien: sin `envio` esto no es un
  #  envío. Lo que estaba mal era saltarse el trabajo EN SILENCIO.
  #
  #  Pasó de verdad: un mantenedor puso `publicado` desde el desplegable de la
  #  web, que REEMPLAZA las etiquetas marcadas en vez de añadir una, y se llevó
  #  `envio` por delante. El trabajo se saltó, no comentó nadie, y la incidencia
  #  se quedó con `publicado` puesta y el registro sin tocar — o sea, con toda
  #  la pinta de estar publicado sin estarlo. De las dos maneras de fallar, esa
  #  es la peor.
  #
  #  Así que se quita la etiqueta que miente y se dice por qué. Quitarla emite
  #  `unlabeled`, que no dispara nada: no hay bucle.
  sin-envio:
    if: >
      github.event.action == 'labeled'
      && github.event.label.name == 'publicado'
      && !contains(github.event.issue.labels.*.name, 'envio')
    runs-on: ubuntu-latest
    steps:
      - name: Deshacer la firma y explicarla
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$NUMERO" --repo "$REPO" --remove-label publicado || true
          cat > /tmp/aviso.md <<'FIN'
          Esta incidencia ya no lleva la etiqueta `envio`, así que **no se ha publicado nada**: el registro está como estaba.

          Suele pasar por el desplegable de etiquetas de la web, que **reemplaza** lo que hubiera marcado en vez de añadir. He quitado `publicado` para que la incidencia no aparente lo contrario.

          Para publicarlo: vuelve a poner `envio` y después `publicado`, sin desmarcar las demás.
          FIN
          gh issue comment "$NUMERO" --repo "$REPO" --body-file /tmp/aviso.md
